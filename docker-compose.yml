services:
  postgres:
    image: postgres:16-alpine
    container_name: nutriscan-postgres
    environment:
      POSTGRES_DB: nutriscan
      POSTGRES_USER: nutriscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutriscan_dev}
    ports:
      - "5432:5432"
    volumes:
      - nutriscan_pgdata:/var/lib/postgresql/data
      - ./data-pipeline/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutriscan -d nutriscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api_data:
    build:
      context: ./data-pipeline
      dockerfile: api_data/Dockerfile
    container_name: nutriscan-api-data
    environment:
      DATABASE_URL: postgresql://nutriscan:${POSTGRES_PASSWORD:-nutriscan_dev}@postgres:5432/nutriscan
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-moi-en-local}
      API_CLIENT_ID: ${API_CLIENT_ID:-nutriscan-app}
      API_CLIENT_SECRET: ${API_CLIENT_SECRET:-change-moi-en-local}
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy

  api_ia:
    build:
      context: ./ai-service
      dockerfile: api_ia/Dockerfile
    container_name: nutriscan-api-ia
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-moi-en-local}
      API_CLIENT_ID: ${API_CLIENT_ID:-nutriscan-app}
      API_CLIENT_SECRET: ${API_CLIENT_SECRET:-change-moi-en-local}
      DATA_API_BASE_URL: http://api_data:8000
      # host.docker.internal permet au conteneur de joindre Ollama, execute
      # sur la machine hote (pas en conteneur) - fonctionne nativement avec
      # Docker Desktop (Windows/Mac) ; extra_hosts ci-dessous couvre Linux.
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8011:8000"
    depends_on:
      - api_data

  app_backend:
    build:
      context: ./app
      dockerfile: backend/Dockerfile
    container_name: nutriscan-app-backend
    environment:
      DATABASE_URL: postgresql://nutriscan:${POSTGRES_PASSWORD:-nutriscan_dev}@postgres:5432/nutriscan
      RGPD_ENCRYPTION_KEY: ${RGPD_ENCRYPTION_KEY:-change-moi-en-local}
      APP_JWT_SECRET_KEY: ${APP_JWT_SECRET_KEY:-change-moi-en-local}
    ports:
      - "8012:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Monitoring applicatif (competence C20). Autoheberge via docker-compose,
  # comme le reste de la stack de developpement - zero compte/service cloud
  # tiers (Grafana Cloud, Datadog...), coherent avec le principe pose des le
  # cadrage (docs/01-cadrage/architecture.md).
  prometheus:
    image: prom/prometheus:latest
    container_name: nutriscan-prometheus
    volumes:
      - ./app/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app_backend

  grafana:
    # Version epinglee plutot que ":latest" - "latest" a resolu vers une
    # version dont le rendu de tableau de bord etait casse dans cet
    # environnement (aucun panneau ne s'affichait, meme un panneau texte
    # sans requete), trouve en testant reellement (voir
    # docs/04-bloc3-app/monitoring-app.md). Une image versionnee et figee est
    # de toute façon la pratique recommandee pour la reproductibilite.
    image: grafana/grafana:11.1.0
    container_name: nutriscan-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nutriscan_dev}
    volumes:
      - ./app/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./app/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  nutriscan_pgdata:
